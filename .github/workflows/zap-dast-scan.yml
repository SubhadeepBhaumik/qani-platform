name: OWASP ZAP DAST Scan

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: ZAP Baseline Scan (passive, safe for production)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://qani.io'
          cmd_options: '-a'
          fail_action: false
